[server]
# Sirve ./static/* en /app/static/* (avatar.glb para el componente Three.js)
enableStaticServing = true

[theme]
base = "light"
primaryColor = "#E8998D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFF7F5"
textColor = "#3A3A3A"
font = "sans serif"

[client]
toolbarMode = "minimal"
