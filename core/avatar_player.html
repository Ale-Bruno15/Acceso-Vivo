<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AccesoVivo — Avatar LSRD</title>
<style>
  :root { --ink:#14253D; --muted:#6A7C93; --rose:#00A3C8; --rose-d:#0E5AA8; }   /* paleta SDP */
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif; color:var(--ink); }
  #card { position:relative; height:100%; border-radius:24px; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 18%, #FFFFFF 0%, #F4F9FD 58%, #E6F0F8 100%); }
  canvas { display:block; }
  .chip { position:absolute; top:14px; left:16px; display:flex; align-items:center; gap:8px;
    padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.8); backdrop-filter:blur(6px);
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    box-shadow:0 2px 10px rgba(1,44,107,.08); }
  .dot { width:8px; height:8px; border-radius:50%; background:#CFC6C4; }
  .chip.live .dot { background:var(--rose); animation:pulse 1.2s infinite; }
  .chip.live { color:var(--rose-d); }
  @keyframes pulse { 50% { opacity:.35; } }
  #replay { position:absolute; top:12px; right:14px; width:34px; height:34px; border-radius:50%; border:0;
    background:rgba(255,255,255,.85); color:var(--rose-d); font-size:17px; cursor:pointer; display:none;
    box-shadow:0 2px 10px rgba(1,44,107,.12); }
  #play { position:absolute; inset:0; margin:auto; width:88px; height:88px; border-radius:50%; border:0;
    background:#fff; color:var(--rose-d); font-size:30px; cursor:pointer; display:none;
    box-shadow:0 10px 30px rgba(1,44,107,.25); }
  #caption { position:absolute; left:16px; right:16px; bottom:14px; padding:10px 16px 12px; border-radius:16px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(8px); box-shadow:0 6px 24px rgba(1,44,107,.12);
    display:none; }
  #gloss { font-size:11px; letter-spacing:.2em; color:var(--muted); margin-bottom:4px; }
  #gloss b { color:var(--rose-d); font-weight:600; }
  #words { font-size:18px; line-height:1.45; }
  #words span { transition:color .12s; }
  #words span.on { color:var(--rose-d); font-weight:600; }
  #err { position:absolute; inset:auto 16px 16px 16px; font-size:13px; color:#9b3b31; display:none; }
</style>
</head>
<body>
<div id="card">
  <div class="chip" id="chip"><span class="dot"></span><span id="chipText">Cargando avatar…</span></div>
  <button id="replay" title="Repetir respuesta">↻</button>
  <button id="play" title="Reproducir respuesta">▶</button>
  <div id="caption"><div id="gloss"></div><div id="words"></div></div>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script id="payload" type="application/json">__PAYLOAD__</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const P = JSON.parse(document.getElementById('payload').textContent);
const LEX = P.lexicon, SCRIPT = P.script, SHAPES = LEX.handshapes;
const V3 = THREE.Vector3, Q = THREE.Quaternion;
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ease = (x) => x * x * (3 - 2 * x);
const state = { rig: 'loading', clock: -1, gloss: null, audio: 'none' };
window.__avatar = state;   // inspección / pruebas

// ───────────────────────── Escena ─────────────────────────
const card = $('card');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
card.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 20);
camera.position.set(0, 1.3, 2.6);
camera.lookAt(0, 1.2, 0);
let rig = null;
function resize() {
  const w = card.clientWidth, h = card.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (rig) frameCamera(rig);
}
// Encuadre de intérprete: de la cintura a la coronilla, con el espacio de signado completo a lo ancho.
function frameCamera(r) {
  const u = r.unit, top = r.shMid.y + .36 * u, bottom = r.shMid.y - .58 * u;   // bajo = hueco para subtítulos
  const cy = (top + bottom) / 2;
  const h = Math.max((top - bottom) * 1.08, (.95 * u) / camera.aspect);
  const dist = (h / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.position.set(r.shMid.x, cy + .03 * u, r.shMid.z + dist);
  camera.lookAt(r.shMid.x, cy, r.shMid.z);
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xffffff, 0xdce9f5, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.7);
keyLight.position.set(1.4, 3.2, 2.4); keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
Object.assign(keyLight.shadow.camera, { left: -1.5, right: 1.5, top: 2.5, bottom: -0.5 });
scene.add(keyLight);
const fill = new THREE.DirectionalLight(0xeaf2fb, 0.6); fill.position.set(-2, 1.4, 1.2); scene.add(fill);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ───────────────────────── Maniquí procedural (respaldo) ─────────────────────────
// Se construye con huesos THREE.Bone con nombres Mixamo, así usa EXACTAMENTE el mismo solver que un GLB.
function buildMannequin() {
  const M = {
    skin:  new THREE.MeshStandardMaterial({ color: 0xF4CBBF, roughness: .5 }),
    joint: new THREE.MeshStandardMaterial({ color: 0xC7887B, roughness: .55 }),
    hair:  new THREE.MeshStandardMaterial({ color: 0x9C6B63, roughness: .75 }),
    eye:   new THREE.MeshStandardMaterial({ color: 0x3B2A28, roughness: .3 }),
    lip:   new THREE.MeshStandardMaterial({ color: 0xB4645A, roughness: .5 }),
    mouth: new THREE.MeshStandardMaterial({ color: 0x6E2F2B, roughness: .6 }),
  };
  const UP = new V3(0, 1, 0), DOWN = new V3(0, -1, 0);
  const mesh = (geo, mat, parent, pos = [0, 0, 0], scale = [1, 1, 1]) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.scale.set(...scale);
    m.castShadow = true; parent.add(m); return m;
  };
  const bone = (name, parent, pos) => {
    const b = new THREE.Bone(); b.name = name; b.position.set(...pos); parent.add(b); return b;
  };
  const limb = (parent, len, r, mat = M.skin, dir = DOWN) => {
    const m = mesh(new THREE.CapsuleGeometry(r, Math.max(.001, len - 2 * r), 6, 14), mat, parent);
    m.quaternion.setFromUnitVectors(UP, dir); m.position.copy(dir.clone().multiplyScalar(len / 2));
    return m;
  };
  const ball = (parent, r, mat = M.joint) => mesh(new THREE.SphereGeometry(r, 20, 14), mat, parent);

  const root = new THREE.Group();
  const hips = bone('Hips', root, [0, 1.0, 0]);
  mesh(new THREE.SphereGeometry(.13, 32, 20), M.skin, hips, [0, -.03, 0], [1.08, .62, .7]);
  for (const sx of [-1, 1]) {                       // piernas estáticas
    const hip = new THREE.Group(); hip.position.set(sx * .095, -.08, 0); hips.add(hip);
    ball(hip, .068); limb(hip, .44, .066);
    const knee = new THREE.Group(); knee.position.set(0, -.44, 0); hip.add(knee);
    ball(knee, .05); limb(knee, .42, .05);
    mesh(new THREE.BoxGeometry(.08, .05, .2), M.skin, knee, [0, -.44, .04]);
  }
  const spine = bone('Spine', hips, [0, .12, 0]);
  mesh(new THREE.SphereGeometry(.085, 28, 18), M.joint, spine, [0, .04, 0], [1, .85, .75]);
  const chest = bone('Spine2', spine, [0, .2, 0]);
  mesh(new THREE.SphereGeometry(.14, 32, 20), M.skin, chest, [0, .01, 0], [1, 1.12, .62]);
  const neck = bone('Neck', chest, [0, .17, 0]); limb(neck, .1, .04, M.skin, UP);
  const head = bone('Head', neck, [0, .08, 0]);

  for (const [side, sx] of [['Right', -1], ['Left', 1]]) {   // la avatar mira a +z: su derecha está en -x
    const sh = bone(side + 'Shoulder', chest, [sx * .05, .14, 0]);
    mesh(new THREE.SphereGeometry(.068, 20, 14), M.skin, sh, [sx * .09, 0, 0], [1.2, .8, .9]);
    const arm = bone(side + 'Arm', sh, [sx * .12, 0, 0]); ball(arm, .048); limb(arm, .28, .043);
    const fore = bone(side + 'ForeArm', arm, [0, -.28, 0]); ball(fore, .038); limb(fore, .25, .035);
    const hand = bone(side + 'Hand', fore, [0, -.25, 0]); ball(hand, .028);
    mesh(new THREE.BoxGeometry(.026, .08, .072), M.skin, hand, [0, -.045, 0]);
    for (const [n, z, sc] of [['Index', .026, .95], ['Middle', .008, 1], ['Ring', -.01, .94], ['Pinky', -.027, .78]]) {
      let parent = hand, pos = [0, -.088, z];
      [.034, .024, .02].forEach((L, i) => {
        const b = bone(`${side}Hand${n}${i + 1}`, parent, pos); limb(b, L * sc, .0085);
        parent = b; pos = [0, -L * sc, 0];
      });
    }
    const tdir = new V3(-sx * .2, -.7, .7).normalize();   // pulgar hacia delante/abajo, del lado palmar
    let parent = hand, pos = [sx * .004, -.02, .036];
    [.03, .026, .022].forEach((L, i) => {
      const b = bone(`${side}HandThumb${i + 1}`, parent, pos); limb(b, L, .0095, M.skin, tdir);
      parent = b; pos = tdir.clone().multiplyScalar(L).toArray();
    });
  }

  // Cabeza y rostro (marcadores no manuales)
  mesh(new THREE.SphereGeometry(.1, 32, 24), M.skin, head, [0, .1, 0], [.86, 1.08, .95]);
  mesh(new THREE.SphereGeometry(.104, 32, 16, 0, Math.PI * 2, 0, Math.PI * .38), M.hair, head, [0, .115, -.006], [.9, 1.08, .98]);
  mesh(new THREE.SphereGeometry(.1, 28, 20), M.hair, head, [0, .09, -.035], [.9, 1, .8]);
  mesh(new THREE.SphereGeometry(.045, 20, 14), M.hair, head, [0, .2, -.085]);   // moño
  const eyes = [-1, 1].map((sx) => mesh(new THREE.SphereGeometry(.011, 16, 12), M.eye, head, [sx * .032, .112, .09], [1, 1, .6]));
  const brows = [-1, 1].map((sx) => {
    const m = mesh(new THREE.CapsuleGeometry(.0035, .026, 4, 8), M.hair, head, [sx * .034, .138, .09]);
    m.rotation.z = Math.PI / 2; m.userData = { sx, y: .138 }; return m;
  });
  const lips = mesh(new THREE.TorusGeometry(.02, .0042, 8, 28, Math.PI), M.lip, head, [0, .06, .089]);
  lips.rotation.z = Math.PI;   // arco ∪ = sonrisa; escala Y negativa = ∩ ceño
  const inner = mesh(new THREE.SphereGeometry(.015, 16, 12), M.mouth, head, [0, .056, .086], [1, .1, .35]);
  mesh(new THREE.SphereGeometry(.011, 12, 10), M.skin, head, [0, .088, .096], [.8, 1, .9]);

  const face = {
    kind: 'procedural',
    set(w) {
      const g = (k) => w[k] || 0;
      for (const b of brows) {
        b.position.y = b.userData.y + .007 * g('browUp') - .004 * g('browDown');
        b.rotation.z = Math.PI / 2 + b.userData.sx * (.35 * g('browDown') - .15 * g('browUp'));
      }
      const open = Math.max(.08, 1 - g('blink')) * (1 + .3 * g('eyesWide') - .35 * g('squint'));
      for (const e of eyes) e.scale.y = open;
      lips.scale.y = .35 + .9 * g('smile') - 1.3 * g('frown');
      lips.scale.x = 1 + .2 * g('smile') - .35 * g('pucker');
      inner.scale.y = .1 + g('jawOpen');
      inner.scale.x = 1 - .3 * g('pucker');
    },
  };
  return { root, face };
}

// ───────────────────────── Rostro por blendshapes ARKit (GLB) ─────────────────────────
const ARKIT = {
  smile:    { mouthSmileLeft: 1, mouthSmileRight: 1, cheekSquintLeft: .3, cheekSquintRight: .3 },
  frown:    { mouthFrownLeft: 1, mouthFrownRight: 1 },
  browUp:   { browInnerUp: 1, browOuterUpLeft: .7, browOuterUpRight: .7 },
  browDown: { browDownLeft: 1, browDownRight: 1 },
  eyesWide: { eyeWideLeft: 1, eyeWideRight: 1 },
  squint:   { eyeSquintLeft: 1, eyeSquintRight: 1 },
  pucker:   { mouthPucker: 1 },
  cheekPuff:{ cheekPuff: 1 },
  blink:    { eyeBlinkLeft: 1, eyeBlinkRight: 1 },
  jawOpen:  { jawOpen: .5, viseme_aa: .6 },   // sin mouthOpen: duplicaba la apertura de la mandíbula
};
const ARKIT_NAMES = [...new Set(Object.values(ARKIT).flatMap(Object.keys))];
function morphFace(root) {
  const meshes = [];
  root.traverse((o) => { if (o.isMesh && o.morphTargetDictionary) meshes.push(o); });
  const ok = meshes.some((m) => 'mouthSmileLeft' in m.morphTargetDictionary || 'jawOpen' in m.morphTargetDictionary);
  return {
    kind: ok ? 'arkit' : 'none',
    set(w) {
      const acc = {};
      for (const [k, v] of Object.entries(w)) {
        for (const [n, f] of Object.entries(ARKIT[k] || {})) acc[n] = Math.min(1, (acc[n] || 0) + v * f);
      }
      for (const m of meshes) for (const n of ARKIT_NAMES) {
        const i = m.morphTargetDictionary[n];
        if (i !== undefined) m.morphTargetInfluences[i] = acc[n] || 0;
      }
    },
  };
}

// ───────────────────────── Solver de señas (independiente del rig) ─────────────────────────
// Lexicón: +x = derecha de la avatar. Mundo: la avatar mira a +z, su derecha está en -x.
const toWorld = (a) => new V3(-a[0], a[1], a[2]);
function basisQ(fingers, palm) {        // orientación a partir de (dirección de dedos, normal de palma)
  const Y = fingers.clone().normalize();
  const Z = palm.clone().sub(Y.clone().multiplyScalar(palm.dot(Y)));
  if (Z.lengthSq() < 1e-6) Z.set(0, 0, 1);
  Z.normalize();
  const X = new V3().crossVectors(Y, Z);
  return new Q().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
}
const FINGERS = ['Thumb', 'Index', 'Middle', 'Ring', 'Pinky'];

class Rig {
  static bones(root) {
    const map = {};
    root.traverse((o) => { if (o.isBone) map[o.name.replace(/^mixamorig[:_]?/i, '').replace(/^.*:/, '')] = o; });
    return map;
  }
  constructor(root, bones, face, kind) {
    this.root = root; this.b = bones; this.face = face; this.kind = kind;
    root.updateMatrixWorld(true);
    const wp = (o) => o.getWorldPosition(new V3());
    const wq = (o) => o.getWorldQuaternion(new Q());
    this.rest = new Map(); for (const o of Object.values(bones)) this.rest.set(o, o.quaternion.clone());
    const shR = wp(bones.RightArm), shL = wp(bones.LeftArm);
    this.shMid = shR.clone().add(shL).multiplyScalar(.5);
    this.unit = shR.distanceTo(shL) / 0.34;          // lexicón calibrado a 34 cm entre hombros
    this.spine = bones.Spine2 || bones.Spine1 || bones.Spine;
    this.sides = {};
    for (const side of ['Right', 'Left']) {
      const s = side === 'Right' ? 1 : -1;
      const arm = bones[side + 'Arm'], fore = bones[side + 'ForeArm'], hand = bones[side + 'Hand'];
      const pA = wp(arm), pF = wp(fore), pH = wp(hand);
      const f1 = (n) => bones[`${side}Hand${n}1`];
      const finger = (f1('Middle') ? wp(f1('Middle')) : pH.clone().add(pH.clone().sub(pF))).sub(pH).normalize();
      const lateral = f1('Index') && f1('Pinky') ? wp(f1('Index')).sub(wp(f1('Pinky'))).normalize() : new V3(0, 0, 1);
      const palm = new V3().crossVectors(lateral, finger).multiplyScalar(s).normalize();
      const fingers = {};
      for (const n of FINGERS) {
        const chain = [1, 2, 3].map((i) => bones[`${side}Hand${n}${i}`]).filter(Boolean);
        if (!chain.length) continue;
        const dir = n === 'Thumb' && chain[1] ? wp(chain[1]).sub(wp(chain[0])).normalize() : finger;
        const axisW = new V3().crossVectors(dir, palm).normalize();   // +ángulo = flexión hacia la palma
        fingers[n] = { chain, axes: chain.map((bn) => axisW.clone().applyQuaternion(wq(bn.parent).invert())) };
      }
      this.sides[side] = {
        s, arm, fore, hand, fingers, a: pA.distanceTo(pF), l: pF.distanceTo(pH),
        dirA: pF.clone().sub(pA).normalize(), dirF: pH.clone().sub(pF).normalize(),
        qA: wq(arm), qF: wq(fore), qH: wq(hand), basis: basisQ(finger, palm),
      };
    }
    if (bones.Head) this.headRest = wq(bones.Head);
  }
  setWorld(bone, qWorld) {
    const pq = bone.parent.getWorldQuaternion(new Q());
    bone.quaternion.copy(pq.invert().multiply(qWorld));
    bone.updateMatrixWorld(true);
  }
  breathe(t) {
    if (!this.spine) return;
    this.spine.quaternion.copy(this.rest.get(this.spine))
      .premultiply(new Q().setFromAxisAngle(new V3(1, 0, 0), Math.sin(t * 1.6) * .012));
    this.root.updateMatrixWorld(true);
  }
  // h = { loc, palm, fingers, curls }  (espacio del lexicón)
  solveHand(side, h) {
    const S = this.sides[side];
    const sh = S.arm.getWorldPosition(new V3());
    const target = this.shMid.clone().add(toWorld(h.loc).multiplyScalar(this.unit));
    const d = target.clone().sub(sh);
    const dist = clamp(d.length(), Math.abs(S.a - S.l) + 1e-3, S.a + S.l - 1e-3);
    d.normalize();
    // IK analítico de 2 huesos; el codo cae hacia abajo, atrás y afuera
    const cosA = (S.a * S.a + dist * dist - S.l * S.l) / (2 * S.a * dist);
    const along = S.a * cosA, hgt = Math.sqrt(Math.max(0, S.a * S.a - along * along));
    const pole = new V3(-S.s * .45, -1, -.35).normalize();
    pole.sub(d.clone().multiplyScalar(pole.dot(d))).normalize();
    const elbow = sh.clone().addScaledVector(d, along).addScaledVector(pole, hgt);
    const wrist = sh.clone().addScaledVector(d, dist);

    const qA = new Q().setFromUnitVectors(S.dirA, elbow.clone().sub(sh).normalize()).multiply(S.qA);
    this.setWorld(S.arm, qA);
    const R = qA.clone().multiply(S.qA.clone().invert());          // antebrazo "arrastrado" por el brazo
    const carriedDir = S.dirF.clone().applyQuaternion(R);
    const qF = new Q().setFromUnitVectors(carriedDir, wrist.clone().sub(elbow).normalize()).multiply(R.multiply(S.qF));
    this.setWorld(S.fore, qF);
    const qH = basisQ(toWorld(h.fingers), toWorld(h.palm)).multiply(S.basis.clone().invert()).multiply(S.qH);
    this.setWorld(S.hand, qH);

    FINGERS.forEach((n, i) => {
      const F = S.fingers[n]; if (!F) return;
      const js = n === 'Thumb' ? [.35, .55, .5] : [.95, 1.1, .75];
      F.chain.forEach((bn, j) => {
        bn.quaternion.setFromAxisAngle(F.axes[j], h.curls[i] * js[j] * Math.PI / 2).multiply(this.rest.get(bn));
      });
    });
  }
  setHead(nod, shake, tilt) {
    if (!this.b.Head) return;
    this.setWorld(this.b.Head, new Q().setFromEuler(new THREE.Euler(nod, shake, tilt, 'YXZ')).multiply(this.headRest));
  }
}

async function loadGLB(url) {
  const gltf = await new GLTFLoader().loadAsync(new URL(url, document.baseURI).href);
  const root = gltf.scene;
  root.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
  const box = new THREE.Box3().setFromObject(root);
  const s = 1.68 / (box.max.y - box.min.y);
  root.scale.setScalar(s);
  root.position.set(-(box.min.x + box.max.x) / 2 * s, -box.min.y * s, -(box.min.z + box.max.z) / 2 * s);
  scene.add(root);
  const bones = Rig.bones(root);
  for (const n of ['RightArm', 'RightForeArm', 'RightHand', 'LeftArm', 'LeftForeArm', 'LeftHand']) {
    if (!bones[n]) { scene.remove(root); throw new Error(`El GLB no tiene el hueso ${n} (se requiere esqueleto Mixamo/Ready Player Me)`); }
  }
  return new Rig(root, bones, morphFace(root), 'glb');
}

// ───────────────────────── Línea de tiempo de glosas ─────────────────────────
const handOf = (h) => ({ loc: h.loc, palm: h.palm, fingers: h.fingers, curls: SHAPES[h.shape] || SHAPES.relaxed });
const REST = { R: handOf(LEX.rest.R), L: handOf(LEX.rest.L) };
const GAP = 0.25, LEAD = 0.35;

function buildTimeline(glosses) {
  const keys = [{ time: 0, R: REST.R, L: REST.L }], segs = [];
  let t = LEAD;
  for (const g of glosses) {
    const G = LEX.glosses[g]; if (!G) continue;
    for (const k of G.keys) keys.push({ time: t + k.t * G.duration, R: k.R ? handOf(k.R) : REST.R, L: k.L ? handOf(k.L) : REST.L });
    segs.push({ gloss: g, start: t, end: t + G.duration, face: G.face || {} });
    t += G.duration + GAP;
  }
  keys.push({ time: t + GAP, R: REST.R, L: REST.L });
  return { keys, segs, total: t + GAP };
}
const lerp3 = (a, b, x) => a.map((v, i) => v + (b[i] - v) * x);
function lerpDir(a, b, x) {
  const v = lerp3(a, b, x), n = Math.hypot(...v);
  return n < 1e-3 ? b : v.map((c) => c / n);
}
const lerpHand = (a, b, x) => ({
  loc: lerp3(a.loc, b.loc, x), palm: lerpDir(a.palm, b.palm, x), fingers: lerpDir(a.fingers, b.fingers, x),
  curls: a.curls.map((c, i) => c + (b.curls[i] - c) * x),
});
function sampleHands(tl, c) {
  const K = tl.keys;
  for (let i = 1; i < K.length; i++) {
    if (c <= K[i].time) {
      const a = K[i - 1], b = K[i], x = ease(clamp((c - a.time) / Math.max(1e-4, b.time - a.time), 0, 1));
      return { R: lerpHand(a.R, b.R, x), L: lerpHand(a.L, b.L, x) };
    }
  }
  return { R: REST.R, L: REST.L };
}
function sampleFace(tl, c) {
  const w = {}, head = { nod: 0, shake: 0, tilt: 0 }; let current = null;
  for (const s of tl.segs) {
    const env = ease(clamp((c - s.start + .15) / .3, 0, 1)) * ease(clamp((s.end + .15 - c) / .3, 0, 1));
    if (env <= 0) continue;
    if (c >= s.start && c <= s.end + GAP) current = s.gloss;
    for (const [k, v] of Object.entries(s.face)) {
      if (k === 'headNod') head.nod += v * env * .16 * Math.sin((c - s.start) * Math.PI * 4.4);
      else if (k === 'headShake') head.shake += v * env * .2 * Math.sin((c - s.start) * Math.PI * 4);
      else if (k === 'headTilt') head.tilt += v * env * .14;
      else w[k] = (w[k] || 0) + v * env;
    }
  }
  return { w, head, current };
}

// ───────────────────────── Audio = reloj maestro ─────────────────────────
let tl = null, audio = null, k = 1, wallStart = null, endedAt = null, running = false;
const words = SCRIPT?.words || [];
const syll = (w) => Math.max(1, (w.match(/[aeiouáéíóúü]+/gi) || []).length);

function clock() {
  if (!running) return -1;
  if (audio) return endedAt != null ? audio.duration * k + (performance.now() - endedAt) / 1000 : audio.currentTime * k;
  return (performance.now() - wallStart) / 1000;
}
// Boca: objetivo suave por sílaba (sin², sin picos en V) que después se filtra en el tiempo.
const MOUTH_GAIN = .45;                      // apertura máxima: subir o bajar para afinar
function mouthTarget() {
  if (!audio || audio.paused || endedAt != null || !audio.duration) return 0;
  const f = audio.currentTime / audio.duration;
  const i = words.findIndex((w) => f >= w.start && f < w.end);
  markWord(i);
  if (i < 0) return 0;
  const w = words[i], ph = (f - w.start) / Math.max(1e-4, w.end - w.start);
  const edge = Math.min(1, ph / .15, (1 - ph) / .15);   // entra y sale suave en cada palabra
  return MOUTH_GAIN * edge * Math.sin(Math.PI * ph * syll(w.word)) ** 2;
}
let mouth = 0, lastNow = null;
function smoothMouth(now) {                  // filtro exponencial independiente de los FPS
  const dt = lastNow == null ? 0 : Math.min(.1, (now - lastNow) / 1000);
  lastNow = now;
  const target = mouthTarget(), tau = target > mouth ? .07 : .11;   // abre algo más rápido de lo que cierra
  mouth += (target - mouth) * (1 - Math.exp(-dt / tau));
  return (state.mouth = mouth);
}
let lastWord = -2;
function markWord(i) {
  if (i === lastWord) return; lastWord = i;
  document.querySelectorAll('#words span').forEach((s, j) => s.classList.toggle('on', j === i));
}
function setChip(text, live) { $('chipText').textContent = text; $('chip').classList.toggle('live', !!live); }

function play() {
  $('play').style.display = 'none';
  endedAt = null; lastWord = -2;
  if (audio) {
    audio.currentTime = 0;
    audio.play().then(() => { running = true; state.audio = 'playing'; setChip('Respondiendo en LSRD', true); })
      .catch(() => { state.audio = 'blocked'; $('play').style.display = 'block'; setChip('Toca ▶ para reproducir', false); });
  } else {
    wallStart = performance.now(); running = true; setChip('Respondiendo en LSRD', true);
  }
}
function startScript() {
  if (!SCRIPT || !SCRIPT.glosses) { setChip('En espera', false); return; }
  tl = buildTimeline(SCRIPT.glosses);
  $('caption').style.display = 'block';
  $('words').innerHTML = words.map((w) => `<span>${w.word}</span>`).join(' ');
  $('replay').style.display = 'block';
  if (SCRIPT.audio) {
    audio = new Audio(SCRIPT.audio);
    audio.addEventListener('loadedmetadata', () => { k = clamp(tl.total / audio.duration, .75, 1.4); });
    audio.addEventListener('ended', () => { endedAt = performance.now(); markWord(-1); state.audio = 'ended'; });
  }
  play();
}
$('play').onclick = play;
$('replay').onclick = play;

// ───────────────────────── Bucle principal ─────────────────────────
let nextBlink = 2, blinkT = -1;
function blinkValue(t) {
  if (t > nextBlink) { blinkT = t; nextBlink = t + 2.5 + Math.random() * 3; }
  const x = (t - blinkT) / .16;
  return x >= 0 && x <= 1 ? Math.sin(Math.PI * x) : 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (rig) {
    const t = now / 1000, c = clock();
    state.clock = c;
    let hands = { R: REST.R, L: REST.L }, face = { w: {}, head: { nod: 0, shake: 0, tilt: 0 }, current: null };
    if (tl && c >= 0) {
      hands = sampleHands(tl, c); face = sampleFace(tl, c);
      if (c > tl.total && (!audio || endedAt != null)) setChip('Respuesta completada', false);
    }
    state.gloss = face.current;
    $('gloss').innerHTML = (tl?.segs || []).map((s) => (s.gloss === face.current ? `<b>${s.gloss}</b>` : s.gloss)).join(' · ');
    rig.breathe(t);
    rig.solveHand('Right', hands.R);
    rig.solveHand('Left', hands.L);
    rig.setHead(face.head.nod + Math.sin(t * .6) * .015, face.head.shake + Math.sin(t * .37) * .03, face.head.tilt);
    rig.face.set({ ...face.w, blink: blinkValue(t), jawOpen: smoothMouth(now) });
  }
  renderer.render(scene, camera);
}

async function init() {
  try {
    if (P.glbUrl) rig = await loadGLB(P.glbUrl);
  } catch (e) {
    console.warn('[avatar] GLB no disponible, usando maniquí:', e);
  }
  if (!rig) {
    const m = buildMannequin(); scene.add(m.root);
    rig = new Rig(m.root, Rig.bones(m.root), m.face, 'mannequin');
  }
  frameCamera(rig);
  state.rig = rig.kind; state.face = rig.face.kind;
  startScript();
}
init().catch((e) => { $('err').style.display = 'block'; $('err').textContent = 'Error del avatar: ' + e.message; console.error(e); });
requestAnimationFrame(frame);
</script>
